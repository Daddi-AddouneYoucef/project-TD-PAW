<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Manager</title>
    <link rel="stylesheet" href="TP1.css">
</head>
<body>

    <div class="container">
        
        <header class="header">
            <div class="title-group">
                <h1>Class Tracker</h1>
                <p>Monitor student progress & participation</p>
            </div>
            <a href="#add-area" class="btn-add">
                <span style="font-size:1.2rem; line-height:0;">+</span> New Student
            </a>
        </header>

        <div id="toast">
            <div style="background:#10b981; width:8px; height:8px; border-radius:50%;"></div>
            <span id="toast-msg">Saved successfully</span>
        </div>

        <div class="glass-card">
            <div class="table-wrapper">
                <table class="modern-table">
                    <thead>
                        <tr>
                            <th class="col-sticky" rowspan="2" style="padding-left:20px;">Student Name</th>
                            <th colspan="2" class="text-center">Week 1</th>
                            <th colspan="2" class="text-center">Week 2</th>
                            <th colspan="2" class="text-center">Week 3</th>
                            <th colspan="2" class="text-center">Week 4</th>
                            <th colspan="2" class="text-center">Week 5</th>
                            <th colspan="2" class="text-center">Week 6</th>
                            <th rowspan="2" style="text-align:center;">Insights</th>
                        </tr>
                        <tr>
                            <th class="th-small">Pr</th><th class="th-small">Pa</th>
                            <th class="th-small">Pr</th><th class="th-small">Pa</th>
                            <th class="th-small">Pr</th><th class="th-small">Pa</th>
                            <th class="th-small">Pr</th><th class="th-small">Pa</th>
                            <th class="th-small">Pr</th><th class="th-small">Pa</th>
                            <th class="th-small">Pr</th><th class="th-small">Pa</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="add-area" class="add-section">
            <h3 style="margin-bottom:20px; font-weight:700;">Add New Student</h3>
            
            <form id="addStudentForm">
                <div class="input-group" style="margin-bottom:20px;">
                    <label>Student ID</label>
                    <input type="text" id="sid" class="modern-input" placeholder="e.g. 2024001" required>
                </div>
                <div class="form-grid">
                    <div class="input-group">
                        <label>Last Name</label>
                        <input type="text" id="lname" class="modern-input" required>
                    </div>
                    <div class="input-group">
                        <label>First Name</label>
                        <input type="text" id="fname" class="modern-input" required>
                    </div>
                </div>
                <button type="submit" class="btn-add" style="width:100%; justify-content:center; padding:14px; border:none; cursor:pointer; margin-top: 15px;">
                    Add Student
                </button>
            </form>
        </div>

    </div>

    <script src="TP1.js"></script>
    
</body>
</html>
